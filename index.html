<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#202124">
    <title>HhH - Banter</title>
    
    <link rel="stylesheet" href="assets/banter.css?v=20261022b">
    
    <script src="assets/sortable.min.js"></script>
    <script src="assets/banter-client-config.js" defer></script>
    <script src="assets/banter.js?v=20261022a" defer></script>
    
    <link rel="manifest" href="manifest.json">
    
</head>
<body>
<header>
    <h1>Banter</h1>

    <div class="header-buttons">
        
        <button id="editModeBtn" type="button">
            Edit mode
        </button>
     
        <button id="themeToggleBtn" type="button">
            ☀ Light theme
        </button>
       
    </div>
</header>

    <main id="app">
        <p>Loading categories...</p>
    </main>
    
<script>
    /*
     * Register Banter's service worker.
     * Refresh the offline cache on startup and reconnection.
     */
    if ("serviceWorker" in navigator) {
        let banterRegistration = null;

function refreshBanterCache() {
    // If offline, the existing "online" listener will retry later.
    if (!navigator.onLine) {
        return;
    }

    if (banterRegistration?.active) {
        banterRegistration.active.postMessage({
            type: "REFRESH_CACHE"
        });
    }
}

// Allow the four-hour timer to request a cache refresh.
window.addEventListener(
    "banter-cache-refresh-requested",
    refreshBanterCache
);

        window.addEventListener("online", refreshBanterCache);

        window.addEventListener("load", async () => {
            try {
                banterRegistration =
                    await navigator.serviceWorker.register("./sw.js");

                await navigator.serviceWorker.ready;

                refreshBanterCache();
            } catch (error) {
                console.error(
                    "Banter: service worker setup failed",
                    error
                );
            }
        });
    }
</script>


</body>
</html>
